name: nexo-backend-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nexo_db
    ports:
      - '5432:5685'
    volumes:
      - nexo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgresql']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexo-postgres-data:
    driver: local
